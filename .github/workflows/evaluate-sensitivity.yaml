name: evaluate-sensitivity
run-name: "Sensitivity evaluation: ${{ inputs.dataset }}"

on:
  workflow_call:
    inputs:
      dataset:
        description: "Langfuse dataset to evaluate"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      dataset:
        description: "Langfuse dataset to evaluate"
        required: true
        type: string
        default: "sensitivity/SubsetIFRCBorderlineSensitiveRecords"


permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install dependencies
        run: uv sync
      - name: Run sensitivity evaluation
        run: uv run python eval/evaluate_sensitivity.py --dataset "$DATASET"
        env:
          # Passed through the environment rather than interpolated into the
          # run script, so a dataset name can't be read as shell syntax.
          DATASET: ${{ inputs.dataset }}
          QFA_DEV_API_KEY: ${{ secrets.QFA_DEV_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ vars.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
