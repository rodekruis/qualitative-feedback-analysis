name: evaluate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assign-codes:
    uses: ./.github/workflows/evaluate-assign-codes.yaml
    permissions:
      contents: read
    secrets: inherit

  sensitivity:
    uses: ./.github/workflows/evaluate-sensitivity.yaml
    with:
      dataset: sensitivity/SubsetIFRCBorderlineSensitiveRecords
    permissions:
      contents: read
    secrets: inherit

  analyze:
    uses: ./.github/workflows/evaluate-analyze.yaml
    with:
      dataset: analyze/cases-frequent-en-v1
    permissions:
      contents: read
    secrets: inherit
