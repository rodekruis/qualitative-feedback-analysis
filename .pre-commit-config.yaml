minimum_pre_commit_version: "3.0"
repos:
- repo: https://github.com/charliermarsh/ruff-pre-commit
  # Ruff version.
  rev: 'v0.14.10'
  hooks:
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
    types_or: [python, pyi]
  - id: ruff-format
- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.35.1
  hooks:
  - id: yamllint
    args: [-d, "{extends: relaxed, rules: {line-length: disable} }"]
    verbose: true
- repo: https://github.com/kynan/nbstripout
  rev: '0.9.1'
  hooks:
  - id: nbstripout
    files: \.ipynb$
- repo: local
  hooks:
  - id: lint_imports
    name: "Lint imports"
    entry: "uv run lint-imports"  # Adapt with custom arguments, if need be.
    language: system
    pass_filenames: false
- repo: https://github.com/astral-sh/ty-pre-commit
  # Keep in sync with the ty pin in pyproject.toml's dev dependencies —
  # ty adds new rules frequently, and a mismatched pre-commit rev flags
  # diagnostics `make ty` / CI (which use the pyproject-pinned version)
  # never see. (v0.0.34's hook script itself is broken — it passes
  # --ignore-active-virtual-env, a flag ty 0.0.34's CLI doesn't support —
  # so 0.0.75 is the oldest usable pairing.)
  rev: v0.0.75
  hooks:
    - id: ty
