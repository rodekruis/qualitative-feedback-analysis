# Custom model pricing for models absent from LiteLLM's built-in cost map,
# or priced differently there (LiteLLM lists Azure Global, not EU Data Zone).
# Registered at startup via litellm.register_model().
# Prices are per-token in USD.
#
# To add a new model, add an entry under "models:" with:
#   input_cost_per_token: cost per input token in USD
#   output_cost_per_token: cost per output token in USD
#   max_tokens: maximum context window size
#   litellm_provider: the LiteLLM provider name (e.g. azure_ai, openai)
#   mode: "chat" for chat completion models
models:
  azure_ai/mistral-large-2411:
    input_cost_per_token: 0.000002
    output_cost_per_token: 0.000006
    max_tokens: 131072
    litellm_provider: azure_ai
    mode: chat
  azure_ai/mistral-medium-2505:
    input_cost_per_token: 0.0000004
    output_cost_per_token: 0.000002
    max_tokens: 131072
    litellm_provider: azure_ai
    mode: chat
  # Mistral publishes a 256k context window for this model, but Azure AI
  # Foundry's serverless deployment has been reported to enforce a much
  # lower cap (2026-08-27). max_tokens isn't enforced anywhere in this repo
  # (it's cost-map metadata only), so 131072 is inherited from the
  # neighbouring mistral-medium-2505 entry as a stated assumption pending
  # confirmation against the actual deployment.
  azure_ai/mistral-medium-3-5:
    input_cost_per_token: 0.0000015
    output_cost_per_token: 0.0000075
    max_tokens: 131072
    litellm_provider: azure_ai
    mode: chat
  # Azure OpenAI EU Data Zone Standard, short-context (<272k input) rates;
  # LLM_MAX_TOTAL_TOKENS keeps every request below 272k input tokens.
  # litellm_provider must be "azure" for azure/ keys, or LiteLLM skips the entry.
  # LiteLLM prices a call by the model name Azure returns, which can be the
  # dated version, so each model is listed under both names.
  # Judge model (ADR-020). Rates and context window from LiteLLM's upstream
  # cost map, which the pinned litellm version does not ship yet.
  azure_ai/mistral-large-4-latest:
    input_cost_per_token: 0.0000007
    output_cost_per_token: 0.0000021
    max_tokens: 1048576
    litellm_provider: azure_ai
    mode: chat
  azure/gpt-5.4: &azure_gpt_5_4
    input_cost_per_token: 0.00000275
    cache_read_input_token_cost: 0.00000028
    output_cost_per_token: 0.0000165
    max_tokens: 1050000
    litellm_provider: azure
    mode: chat
  azure/gpt-5.4-2026-03-05: *azure_gpt_5_4
  azure/gpt-6.1-sol: &azure_gpt_6_1_sol
    input_cost_per_token: 0.0000022
    cache_read_input_token_cost: 0.00000011
    cache_creation_input_token_cost: 0.00000275
    output_cost_per_token: 0.000011
    max_tokens: 1050000
    litellm_provider: azure
    mode: chat
  azure/gpt-6.1-sol-2026-09-29: *azure_gpt_6_1_sol
