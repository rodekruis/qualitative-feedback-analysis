# Custom model pricing for models absent from LiteLLM's built-in cost map.
# Registered at startup via litellm.register_model().
# Prices are per-token in USD.
#
# To add a new model, add an entry under "models:" with:
#   input_cost_per_token: cost per input token in USD
#   output_cost_per_token: cost per output token in USD
#   max_tokens: maximum context window size
#   litellm_provider: the LiteLLM provider name (e.g. azure_ai, openai)
#   mode: "chat" for chat completion models
models:
  azure_ai/mistral-large-2411:
    input_cost_per_token: 0.000002
    output_cost_per_token: 0.000006
    max_tokens: 131072
    litellm_provider: azure_ai
    mode: chat
  azure_ai/mistral-medium-2505:
    input_cost_per_token: 0.0000004
    output_cost_per_token: 0.000002
    max_tokens: 131072
    litellm_provider: azure_ai
    mode: chat
  # Mistral publishes a 256k context window for this model, but Azure AI
  # Foundry's serverless deployment has been reported to enforce a much
  # lower cap (2026-08-27). max_tokens isn't enforced anywhere in this repo
  # (it's cost-map metadata only), so 131072 is inherited from the
  # neighbouring mistral-medium-2505 entry as a stated assumption pending
  # confirmation against the actual deployment.
  azure_ai/mistral-medium-3-5:
    input_cost_per_token: 0.0000015
    output_cost_per_token: 0.0000075
    max_tokens: 131072
    litellm_provider: azure_ai
    mode: chat
  azure/gpt-5.4:
    input_cost_per_token: 0.0000025
    output_cost_per_token: 0.000015
    max_tokens: 1050000
    litellm_provider: azure_ai
    mode: chat
